[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cotton-doctor"
version = "0.1.0"
description = "A reproducible cotton pest and disease detection baseline with local edge deployment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "ultralytics>=8.3,<9",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "opencv-python>=4.10,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
cotton-doctor = "cotton_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["cotton_doctor*"]

[tool.setuptools.package-data]
cotton_doctor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
